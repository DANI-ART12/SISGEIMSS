<form [formGroup]="kmForm" (ngSubmit)="onSubmit()"
      class="max-w-lg mx-auto p-6 bg-white rounded-xl shadow-md space-y-6">

  <h2 class="text-2xl font-bold text-center text-blue-600">Registro de KM y Horarios</h2>

  <!-- Ambulancia -->
  <div>
    <label class="block mb-1 font-medium text-blue-800">Ambulancia</label>
    <select formControlName="ambulancia"
            class="w-full border-gray-300 rounded-md focus:ring-2 focus:ring-blue-300 p-2">
      <option value="" disabled>Selecciona una ambulancia</option>
      <option *ngFor="let amb of ambulancias" [value]="amb.nombre">{{ amb.nombre }}</option>
    </select>
    <p *ngIf="kmForm.get('ambulancia')?.touched && kmForm.get('ambulancia')?.invalid"
       class="text-red-600 text-sm mt-1">Obligatorio.</p>
  </div>

  <!-- KM faltantes -->
  <div>
    <label class="block font-medium text-gray-800">KM Faltantes (Mantenimiento)</label>
    <input type="number" formControlName="kmFaltante" readonly
           [ngClass]="alerta ? 'border-2 border-red-500 bg-red-50' : 'border-gray-300 bg-gray-100'"
           class="w-full rounded-md p-2 transition-colors" />
    <p *ngIf="alerta" class="mt-1 text-sm text-red-600 font-semibold">
      ⚠️ Quedan menos de {{ umbral }} km para mantenimiento.
    </p>
  </div>

  <!-- KM inicial / final -->
  <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
    <div>
      <label class="block mb-1 font-medium text-green-700">KM Inicial</label>
      <input type="number" formControlName="kmInicial"
             class="w-full border-gray-300 rounded-md focus:ring-2 focus:ring-green-300 p-2" />
    </div>
    <div>
      <label class="block mb-1 font-medium text-green-700">KM Final</label>
      <input type="number" formControlName="kmFinal"
             class="w-full border-gray-300 rounded-md focus:ring-2 focus:ring-green-300 p-2" />
    </div>
  </div>

  <!-- Fechas y horas ida/vuelta -->
  <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
    <div>
      <label class="block mb-1 font-medium text-purple-700">Fecha Ida</label>
      <input type="date" formControlName="idaFecha"
             class="w-full border-gray-300 rounded-md focus:ring-2 focus:ring-purple-300 p-2" />
    </div>
    <div>
      <label class="block mb-1 font-medium text-purple-700">Hora Ida</label>
      <input type="time" formControlName="idaHora"
             class="w-full border-gray-300 rounded-md focus:ring-2 focus:ring-purple-300 p-2" />
    </div>
    <div>
      <label class="block mb-1 font-medium text-indigo-700">Fecha Vuelta</label>
      <input type="date" formControlName="vueltaFecha"
             class="w-full border-gray-300 rounded-md focus:ring-2 focus:ring-indigo-300 p-2" />
    </div>
    <div>
      <label class="block mb-1 font-medium text-indigo-700">Hora Vuelta</label>
      <input type="time" formControlName="vueltaHora"
             class="w-full border-gray-300 rounded-md focus:ring-2 focus:ring-indigo-300 p-2" />
    </div>
  </div>

  <!-- Total KM recorridos -->
  <div>
    <label class="block font-medium text-gray-800">Total KM Recorridos</label>
    <input type="number" [value]="totalRecorrido" readonly
           class="w-full bg-gray-100 border-gray-300 rounded-md p-2" />
  </div>

  <!-- Fecha registro y observaciones -->
  <div>
    <label class="block mb-1 font-medium text-blue-800">Fecha Registro</label>
    <input type="date" formControlName="fechaRegistro"
           class="w-full border-gray-300 rounded-md focus:ring-2 focus:ring-blue-300 p-2" />
  </div>
  <div>
    <label class="block mb-1 font-medium text-gray-800">Observaciones</label>
    <textarea formControlName="observaciones" rows="3"
              class="w-full border-gray-300 rounded-md focus:ring-2 focus:ring-gray-300 p-2"></textarea>
  </div>

  <!-- Botón Registrar -->
  <button type="submit"
          class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-2 rounded-md transition">
    Registrar
  </button>
</form>
