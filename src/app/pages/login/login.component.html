<div class="flex items-center justify-center min-h-screen bg-gray-500">
  <div class="flex flex-col md:flex-row bg-white rounded shadow-md w-full max-w-7xl p-8 md:space-x-8 space-y-8 md:space-y-0">

    <!-- Formulario -->
    <form class="w-full md:w-1/2 max-w-md space-y-5" (ngSubmit)="login()" #formulario="ngForm">
      <img src="assets/logoimss.png" alt="ambulancia" class="mb-6 w-1/4 h-auto mx-auto" />
      <h2 class="text-2xl font-bold mb-2 text-center">Iniciar sesión</h2>

      <div>
        <label class="block mb-1 text-sm font-medium">Matrícula</label>
        <input
          [(ngModel)]="matricula"
          name="matricula"
          type="text"
          required
          class="w-full px-3 py-2 border rounded focus:outline-none focus:ring focus:ring-blue-200"
        />
      </div>

      <div class="relative">
        <label class="block mb-1 text-sm font-medium">Contraseña</label>
        <input
          [(ngModel)]="password"
          name="password"
          [type]="mostrarPassword ? 'text' : 'password'"
          required
          class="w-full px-3 py-2 border rounded focus:outline-none focus:ring focus:ring-blue-200 pr-10"
        />
        <button
          type="button"
          class="absolute right-2 top-[2.4rem] text-gray-600 hover:text-gray-900 focus:outline-none"
          (click)="togglePassword()"
          tabindex="-1"
          aria-label="Mostrar u ocultar contraseña"
        >
          <svg *ngIf="!mostrarPassword" xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
            <path stroke-linecap="round" stroke-linejoin="round" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
          </svg>
          <svg *ngIf="mostrarPassword" xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.542-7a9.968 9.968 0 012.034-3.592M3 3l18 18" />
            <path stroke-linecap="round" stroke-linejoin="round" d="M10.477 10.477a3 3 0 014.243 4.243" />
            <path stroke-linecap="round" stroke-linejoin="round" d="M9.88 9.88L3 3" />
            <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 01-3 3" />
          </svg>
        </button>
      </div>

      <button
        type="submit"
        class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-2 rounded transition-colors"
      >
        Entrar
      </button>

      <div *ngIf="error" class="text-red-600 text-center">{{ error }}</div>
    </form>

    <!-- Carrusel de imágenes -->
    <div class="w-full md:w-auto flex items-center justify-center">
      <img
        [src]="imagenesCarrusel[indiceActual]"
        alt="Imagen del carrusel"
        loading="lazy"
        class="rounded-lg shadow-lg object-contain max-w-full max-h-[90vh]"
      />
    </div>

  </div>
</div>
