<div class="max-w-4xl mx-auto p-6 space-y-6">

    <div class="flex justify-between items-center">
      <h2 class="text-2xl font-bold text-blue-600">Lugares de Comisión</h2>
      <button (click)="nuevoRegistro()"
              class="bg-green-600 hover:bg-green-700 text-white px-4 py-2 rounded">
        + Nuevo lugar comisión
      </button>
    </div>
  
    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
      <input type="text" placeholder="Filtrar por estado"
             [(ngModel)]="filtrarEstado"
             class="border p-2 rounded w-full"/>
      <input type="text" placeholder="Filtrar por región"
             [(ngModel)]="filtrarRegion"
             class="border p-2 rounded w-full"/>
    </div>
  
    <!-- Formulario -->
    <form *ngIf="mostrandoFormulario" [formGroup]="form" (ngSubmit)="guardar()"
          class="bg-white p-6 rounded shadow space-y-5">
      <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
        <div>
          <label class="block mb-1">Estado</label>
          <input formControlName="estado" class="w-full border p-2 rounded"/>
        </div>
        <div>
          <label class="block mb-1">Región</label>
          <input formControlName="region" class="w-full border p-2 rounded"/>
        </div>
      </div>
  
      <div>
        <label class="block mb-1">Nombre del Hospital</label>
        <input formControlName="nombreHospital" class="w-full border p-2 rounded"/>
      </div>
  
      <div>
        <label class="block mb-1">Dirección</label>
        <input formControlName="direccion" class="w-full border p-2 rounded"/>
      </div>
  
      <div class="flex items-center space-x-3">
        <input type="checkbox" formControlName="altoCosteVida" id="altoCoste"/>
        <label for="altoCoste">Alto coste de vida?</label>
      </div>
  
      <div>
        <label class="block mb-1">Porcentaje (%)</label>
        <input formControlName="porcentaje" type="number" min="0" max="100"
               [class.opacity-50]="!form.get('altoCosteVida')?.value"
               class="w-full border p-2 rounded"/>
      </div>
  
      <div class="flex justify-end space-x-2">
        <button type="button" (click)="cancelar()"
                class="bg-gray-300 hover:bg-gray-400 text-gray-800 px-4 py-2 rounded">
          Cancelar
        </button>
        <button type="submit"
                class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded">
          Guardar
        </button>
      </div>
    </form>
  
    <!-- Tabla -->
    <table *ngIf="registrosFiltrados.length" class="w-full bg-white rounded shadow">
      <thead>
        <tr class="bg-gray-200 text-left">
          <th class="p-2">Estado</th>
          <th class="p-2">Región</th>
          <th class="p-2">Hospital</th>
          <th class="p-2">Dirección</th>
          <th class="p-2">Alto coste</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let r of registrosFiltrados" class="border-t hover:bg-gray-50">
          <td class="p-2">{{ r.estado }}</td>
          <td class="p-2">{{ r.region }}</td>
          <td class="p-2">{{ r.nombreHospital }}</td>
          <td class="p-2">{{ r.direccion }}</td>
          <td class="p-2">{{ r.altoCosteVida ? r.porcentaje + '%' : 'No' }}</td>
        </tr>
      </tbody>
    </table>
  
    <p *ngIf="!registrosFiltrados.length" class="text-center text-gray-500">
      No hay registros para mostrar.
    </p>
  </div>
