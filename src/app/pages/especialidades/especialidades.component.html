<div class="bg-white p-6 rounded-xl font-sans">
  <div class="max-w-4xl mx-auto p-6 space-y-6">
    <!-- Encabezado y botón nuevo -->
    <div class="flex justify-between items-center">
      <h2 class="text-2xl font-bold text-blue-600">LUGARES COMISIÓN</h2>
      <button
        (click)="abrirModal()"
        class="bg-green-600 hover:bg-green-700 text-white px-4 py-2 rounded transition"
      >
        + Nuevo lugar comisión
      </button>
    </div>

    <!-- Filtros -->
    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
      <input
        type="text"
        placeholder="Filtrar por estado"
        [(ngModel)]="filtrarEstado"
        class="border border-blue-300 rounded px-3 py-2 w-full focus:outline-none focus:ring-2 focus:ring-blue-400 transition"
      />
      <input
        type="text"
        placeholder="Filtrar por región"
        [(ngModel)]="filtrarRegion"
        class="border border-indigo-300 rounded px-3 py-2 w-full focus:outline-none focus:ring-2 focus:ring-indigo-400 transition"
      />
    </div>

    <!-- Tabla de registros -->
    <div class="overflow-x-auto">
      <table *ngIf="registrosFiltrados.length" class="w-full bg-white rounded-lg shadow overflow-hidden">
        <thead class="bg-green-100">
          <tr>
            <th class="p-3 text-left">Estado</th>
            <th class="p-3 text-left">Región</th>
            <th class="p-3 text-left">Hospital</th>
            <th class="p-3 text-left">Dirección</th>
            <th class="p-3 text-left">Alto coste</th>
            <th class="p-3 text-left">Acciones</th>
          </tr>
        </thead>
        <tbody class="text-gray-700">
          <tr *ngFor="let r of registrosFiltrados; let i = index" class="border-t hover:bg-gray-50 transition">
            <td class="p-3">{{ r.estado }}</td>
            <td class="p-3">{{ r.region }}</td>
            <td class="p-3">{{ r.nombreHospital }}</td>
            <td class="p-3">{{ r.direccion }}</td>
            <td class="p-3">{{ r.altoCosteVida ? r.porcentaje + '%' : 'No' }}</td>
            <td class="p-3 space-x-2">
              <button (click)="editar(i)" class="bg-yellow-500 text-white px-3 py-1 rounded">Editar</button>
              <button (click)="eliminar(i)" class="bg-red-500 text-white px-3 py-1 rounded">Eliminar</button>
            </td>
          </tr>
        </tbody>
      </table>
      <p *ngIf="!registrosFiltrados.length" class="text-center text-gray-500 italic py-4">
        No hay registros para mostrar.
      </p>
    </div>
  </div>
</div>

<!-- Modal -->
<div
  *ngIf="mostrandoFormulario"
  class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50"
  (click)="cancelar()"
>
  <div
    class="bg-white p-6 rounded-xl font-sans w-full max-w-4xl mx-4 relative overflow-y-auto max-h-[90vh]"
    (click)="$event.stopPropagation()"
  >
    <!-- Botón cerrar -->
    <button
      class="absolute top-4 right-4 text-gray-600 hover:text-red-600 text-xl"
      (click)="cancelar()"
    >
      ❌
    </button>

    <!-- Formulario -->
    <h2 class="text-2xl font-bold text-blue-600 mb-4">Formulario Lugar Comisión</h2>

    <form [formGroup]="form" (ngSubmit)="guardar()" class="space-y-4">
      <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
        <div>
          <label class="block mb-1 font-medium text-gray-700">Estado</label>
          <input formControlName="estado" class="w-full border border-gray-300 rounded px-3 py-2" />
        </div>
        <div>
          <label class="block mb-1 font-medium text-gray-700">Región</label>
          <input formControlName="region" class="w-full border border-gray-300 rounded px-3 py-2" />
        </div>
      </div>

      <div>
        <label class="block mb-1 font-medium text-gray-700">Nombre del Hospital</label>
        <input formControlName="nombreHospital" class="w-full border border-gray-300 rounded px-3 py-2" />
      </div>

      <div>
        <label class="block mb-1 font-medium text-gray-700">Dirección</label>
        <input formControlName="direccion" class="w-full border border-gray-300 rounded px-3 py-2" />
      </div>

      <div class="flex items-center space-x-2">
        <input
          type="checkbox"
          formControlName="altoCosteVida"
          id="altoCoste"
          class="h-4 w-4 text-green-600 border-gray-300 rounded"
        />
        <label for="altoCoste" class="text-gray-700">¿Alto coste de vida?</label>
      </div>

      <div>
        <label class="block mb-1 font-medium text-gray-700">Porcentaje (%)</label>
        <input
          formControlName="porcentaje"
          type="number"
          min="0"
          max="100"
          [disabled]="!form.get('altoCosteVida')?.value"
          class="w-full border border-gray-300 rounded px-3 py-2"
        />
      </div>

      <div class="flex justify-end space-x-2">
        <button type="button" (click)="cancelar()" class="bg-gray-400 px-4 py-2 rounded">Cancelar</button>
        <button type="submit" class="bg-blue-600 text-white px-4 py-2 rounded" [disabled]="form.invalid">Guardar</button>
      </div>
    </form>
  </div>
</div>
