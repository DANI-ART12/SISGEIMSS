<div class="bg-white rounded-xl shadow-lg p-6 flex flex-col">
  <h2 class="text-xl font-semibold text-gray-700 mb-4">Traslados Mensuales</h2>

  <div class="mb-6 flex flex-col md:flex-row items-center gap-4">
    <div class="flex flex-col">
      <label for="fechaInicio" class="text-sm font-medium text-gray-700">Fecha inicial:</label>
      <input type="date" id="fechaInicio" [(ngModel)]="fechaInicio"
             class="p-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500" />
    </div>
    <div class="flex flex-col">
      <label for="fechaFin" class="text-sm font-medium text-gray-700">Fecha final:</label>
      <input type="date" id="fechaFin" [(ngModel)]="fechaFin"
             class="p-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500" />
    </div>
    
    <button (click)="buscarPorFechas()"
            class="bg-blue-600 text-white px-4 py-2 rounded-md hover:bg-blue-700 transition">Buscar</button>
    
    </div>

  <div class="w-full grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4 p-4">
    <ng-container *ngFor="let graf of graficas; let i = index">
      
      <div [id]="graf.id" class="bg-white rounded-lg shadow-md p-3"> 
        <h3 class="text-md font-semibold text-center mb-2">{{graf.title}}</h3>
        <canvas baseChart
                [data]="graf.data"
                [options]="graf.options"
                [type]="graf.type"
                class="max-h-[200px] w-full">
        </canvas>
        <div class="flex gap-2 mt-2">
          
          <button (click)="descargarGraficaPNG(i, graf.title)" 
                  class="text-sm px-3 py-1 bg-green-500 text-white rounded shadow hover:bg-green-600 hover:scale-105 transition-transform duration-300">
            Descargar PNG
          </button>
          
          <button [disabled]="isLoading" 
                  (click)="descargarGraficaPDFRapido(graf)" 
                  class="text-sm px-3 py-1 bg-purple-500 text-white rounded shadow hover:bg-purple-600 hover:scale-105 transition-transform duration-300 disabled:opacity-50 disabled:cursor-not-allowed">
            {{ isLoading ? 'Generando...' : 'Descargar PDF' }}
          </button>

          </div>
      </div>
    </ng-container>
  </div>
</div>
