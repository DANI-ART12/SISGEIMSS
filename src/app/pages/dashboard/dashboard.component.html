
<div class="flex justify-center items-center h-screen bg-gray-50">
  <div class="bg-blue-100 border border-blue-300 rounded-xl shadow-lg p-10 text-center max-w-5xl w-full">
    
    <h1 class="text-3xl font-bold text-blue-800 mb-4">
      {{ mensajeBienvenida }}
    </h1>

    <!-- Tabla de traslados para USER -->
    <div *ngIf="trasladosAsignados.length > 0" class="overflow-x-auto">
      <table class="min-w-full bg-white rounded-lg shadow">
        <thead>
          <tr class="bg-blue-200 text-blue-900 text-sm">
            <th class="px-4 py-2 text-left">#</th>
            <th class="px-4 py-2 text-left">Folio/Pliego</th>
            <th class="px-4 py-2 text-left">Origen</th>
            <th class="px-4 py-2 text-left">Destino</th>
            <th class="px-4 py-2 text-left">Fecha</th>
            <th class="px-4 py-2 text-left">Estado</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let traslado of trasladosAsignados" class="border-t text-sm">
            <td class="px-4 py-2">{{ traslado.id }}</td>
            <td class="px-4 py-2 font-semibold text-blue-700">{{ traslado.folio }}</td>
            <td class="px-4 py-2">{{ traslado.origen }}</td>
            <td class="px-4 py-2">{{ traslado.destino }}</td>
            <td class="px-4 py-2">{{ traslado.fecha }}</td>
            <td class="px-4 py-2">
              <span 
                class="px-2 py-1 rounded text-xs font-semibold"
                [ngClass]="{
                  'bg-yellow-200 text-yellow-800': traslado.estado === 'Pendiente',
                  'bg-green-200 text-green-800': traslado.estado === 'Confirmado',
                  'bg-red-200 text-red-800': traslado.estado === 'Cancelado'
                }">
                {{ traslado.estado }}
              </span>
            </td>
          </tr>
        </tbody>
      </table>
    </div>

    <!-- Mensaje si no tiene traslados -->
    <p *ngIf="trasladosAsignados.length === 0" class="mt-4 text-gray-700 text-sm">
      No tienes traslados asignados en este momento.
    </p>

  </div>
</div>
