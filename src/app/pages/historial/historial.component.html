<div class="bg-white p-6 rounded-xl font-sans">
  <div class="p-6">
    <h2 class="text-2xl font-semibold mb-6 text-blue-600">HISTORIAL</h2>

    <!-- Filtros -->
    <div class="flex flex-wrap items-center gap-2 mb-6">
      <input
        type="text"
        [(ngModel)]="filtroMatricula"
        placeholder="Buscar por matrícula"
        class="border border-blue-300 rounded px-3 py-2 w-full md:w-1/4 focus:ring-2 focus:ring-blue-400"
      />
      <input
        type="text"
        [(ngModel)]="filtroFolio"
        placeholder="Buscar por folio"
        class="border border-green-300 rounded px-3 py-2 w-full md:w-1/4 focus:ring-2 focus:ring-green-400"
      />
      <input
        type="text"
        [(ngModel)]="filtroPaciente"
        placeholder="Buscar por paciente"
        class="border border-purple-300 rounded px-3 py-2 w-full md:w-1/4 focus:ring-2 focus:ring-purple-400"
      />
      <input
        type="date"
        [(ngModel)]="fechaDesde"
        class="border border-indigo-300 rounded px-3 py-2 w-full md:w-1/4 focus:ring-2 focus:ring-indigo-400"
        placeholder="Fecha desde"
      />
      <input
        type="date"
        [(ngModel)]="fechaHasta"
        class="border border-indigo-300 rounded px-3 py-2 w-full md:w-1/4 focus:ring-2 focus:ring-indigo-400"
        placeholder="Fecha hasta"
      />

      <button
        (click)="limpiarFiltros()"
        class="bg-gray-600 text-white px-4 py-2 rounded hover:bg-gray-700 transition"
        title="Limpiar filtros"
      >
        Limpiar filtros
      </button>
    </div>

    <!-- Tabla -->
    <div class="overflow-x-auto">
      <table class="min-w-full bg-white rounded-lg shadow overflow-hidden">
        <thead>
          <tr class="bg-gray-200 text-gray-800 bg-green-100">
            <th class="px-4 py-3">Fecha</th>
            <th class="px-4 py-3">Folio</th>
            <th class="px-4 py-3">Matrícula Operador</th>
            <th class="px-4 py-3">Nombre Paciente</th>
            <th class="px-4 py-3 text-center">Acciones</th>
          </tr>
        </thead>
        <tbody class="text-gray-700">
          <tr *ngFor="let item of historialFiltrado(); let i = index" class="border-t hover:bg-gray-100">
            <td class="px-4 py-2">{{ item.fecha }}</td>
            <td class="px-4 py-2">{{ item.folio }}</td>
            <td class="px-4 py-2">{{ item.operador }}</td>
            <td class="px-4 py-2">{{ item.paciente }}</td>
            <td class="px-4 py-2 text-center space-x-2">
              <a
                [href]="item.url"
                download
                class="bg-blue-500 text-white px-3 py-1 rounded hover:bg-blue-600 transition"
              >
                Descargar
              </a>
              <button
                (click)="eliminarPliego(item)"
                class="bg-red-500 text-white px-3 py-1 rounded hover:bg-red-600 transition"
              >
                Eliminar
              </button>
            </td>
          </tr>

          <tr *ngIf="historialFiltrado().length === 0">
            <td colspan="5" class="px-4 py-6 text-center text-gray-500 italic">
              No se encontraron resultados.
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
</div>
