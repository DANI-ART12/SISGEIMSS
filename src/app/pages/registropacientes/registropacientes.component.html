<div class="bg-white p-10 rounded-xl font-sans shadow-lg max-w-5xl mx-auto">
  <h2 class="text-2xl font-bold text-blue-600 mb-4">Historial de Pacientes</h2>

  <!-- Filtro de búsqueda -->
  <div class="mb-4">
    <input
      type="text"
      [(ngModel)]="filtro"
      placeholder="Buscar por nombre o NSS..."
      class="border px-4 py-2 rounded-md w-full md:w-1/2"
    />
  </div>

  <!-- Tabla de historial -->
  <div *ngIf="historialFiltrado.length > 0; else sinResultados" class="overflow-x-auto">
    <table class="min-w-full border border-gray-300 rounded-lg">
      <thead class="bg-green-100">
        <tr>
          <th class="py-2 px-4 border border-blue-700">Nombre Completo</th>
          <th class="py-2 px-4 border border-blue-700">NSS</th>
          <th class="py-2 px-4 border border-blue-700">Domicilio</th>
          <th class="py-2 px-4 border border-blue-700">Traslados</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let p of historialFiltrado" class="bg-gray-50 even:bg-white">
          <td class="border border-gray-300 px-4 py-2">
            {{ p.nombre }} {{ p.primerApellido }} {{ p.segundoApellido }}
          </td>
          <td class="border border-gray-300 px-4 py-2">{{ p.nss }}</td>
          <td class="border border-gray-300 px-4 py-2">{{ p.domicilio }}</td>
          <td class="border border-gray-300 px-4 py-2">
            <ul class="list-disc ml-4">
              <li *ngFor="let traslado of p.traslados">
                <span class="font-semibold">{{ traslado.hospital }}</span> - {{ traslado.motivo }}
              </li>
            </ul>
          </td>
        </tr>
      </tbody>
    </table>
  </div>

  <ng-template #sinResultados>
    <p class="text-gray-500 italic mt-4">No se encontraron pacientes.</p>
  </ng-template>
</div>
