<div class="bg-white p-6 rounded-xl font-sans shadow-lg max-w-4xl mx-auto">
    <h2 class="text-2xl font-bold text-blue-600 mb-4 flex items-center">
      REGISTRO PACIENTES
    </h2>
  
    <div class="mb-4 flex items-center justify-between">
      <input
        type="text"
        [(ngModel)]="filtro"
        placeholder="Buscar por nombre..."
        class="border px-4 py-2 rounded-md w-1/2"
      />
      <button
        class="bg-blue-600 text-white px-4 py-2 rounded hover:bg-blue-700"
        (click)="mostrarFormulario = !mostrarFormulario"
      >
        {{ mostrarFormulario ? 'Cancelar' : 'Agregar Paciente' }}
      </button>
    </div>
  
    <!-- Formulario -->
    <form
      *ngIf="mostrarFormulario"
      (ngSubmit)="agregarPaciente()"
      class="space-y-4 mb-6 bg-gray-50 p-4 rounded-lg border"
    >
      <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
        <input
          [(ngModel)]="nuevoPaciente.nombre"
          name="nombre"
          placeholder="Nombre(s)"
          class="border p-2 rounded"
          required
        />
        <input
          [(ngModel)]="nuevoPaciente.primerApellido"
          name="primerApellido"
          placeholder="Primer Apellido"
          class="border p-2 rounded"
          required
        />
        <input
          [(ngModel)]="nuevoPaciente.segundoApellido"
          name="segundoApellido"
          placeholder="Segundo Apellido"
          class="border p-2 rounded"
        />
        <input
          [(ngModel)]="nuevoPaciente.nss"
          name="nss"
          placeholder="NSS"
          class="border p-2 rounded"
          required
        />
        <input
          [(ngModel)]="nuevoPaciente.telefono"
          name="telefono"
          placeholder="Teléfono"
          class="border p-2 rounded"
        />
        <input
          [(ngModel)]="nuevoPaciente.domicilio"
          name="domicilio"
          placeholder="Domicilio"
          class="border p-2 rounded col-span-full"
        />
      </div>
  
      <button
        type="submit"
        class="bg-green-600 text-white px-4 py-2 rounded hover:bg-green-700"
      >
        Guardar Paciente
      </button>
    </form>
  
    <!-- Tabla de pacientes -->
    <div *ngIf="pacientesFiltrados.length > 0; else sinResultados" class="overflow-x-auto">
      <table class="min-w-full border border-gray-300 rounded-lg">
        <thead class="bg-gray-200 bg-green-100">
          <tr>
            <th class="py-2 px-4 border border-blue-700">Nombre Completo</th>
            <th class="py-2 px-4 border border-blue-700">NSS</th>
            <th class="py-2 px-4 border border-blue-700">Teléfono</th>
            <th class="py-2 px-4 border border-blue-700">Domicilio</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let p of pacientesFiltrados" class="bg-gray-50 even:bg-white">
            <td class="border border-gray-300 px-4 py-2">
              {{ p.nombre }} {{ p.primerApellido }} {{ p.segundoApellido }}
            </td>
            <td class="border border-gray-300 px-4 py-2">{{ p.nss }}</td>
            <td class="border border-gray-300 px-4 py-2">{{ p.telefono }}</td>
            <td class="border border-gray-300 px-4 py-2">{{ p.domicilio }}</td>
          </tr>
        </tbody>
      </table>
    </div>
  
    <ng-template #sinResultados>
      <p class="text-gray-500 italic mt-4">No se encontraron pacientes.</p>
    </ng-template>
  </div>
